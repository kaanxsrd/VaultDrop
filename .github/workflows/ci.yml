name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  BUN_VERSION: "1.4.2"

jobs:
  quality:
    name: Biome, typecheck, unit & integration (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test
      - name: Migrations are up to date with the schema
        run: |
          bun run db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then echo "Schema changed without a committed migration"; git status -- drizzle; exit 1; fi

  integration-postgres:
    name: Integration tests (real PostgreSQL, true concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaultdrop
          POSTGRES_PASSWORD: vaultdrop
          POSTGRES_DB: vaultdrop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultdrop" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vaultdrop:vaultdrop@localhost:5432/vaultdrop_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    name: Build & end-to-end (app on Bun, Playwright runner on Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      # Playwright's test runner does not support the Bun runtime; the app under test still runs on Bun.
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Secret scanning & dependency audit
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=moderate

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v4

  container:
    name: Container build & scan
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t vaultdrop:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vaultdrop:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
